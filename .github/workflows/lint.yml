name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    name: Shell static analysis + offline logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Validate the workflow files themselves (this one included). actionlint
      # catches what YAML parsing cannot: unknown action inputs, invalid
      # contexts, matrix field typos. Runs BEFORE shellcheck is installed on
      # purpose: with a shellcheck binary present actionlint would also lint
      # every run: block, which this job already covers at the file level via
      # steps 1-2. Pinned like shellcheck so the gate cannot drift.
      - name: Install actionlint v1.7.12
        run: |
          set -euo pipefail
          VER=1.7.12
          curl -sSfL -o al.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          tar xzf al.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version | head -n1

      - name: Lint workflow files
        # -shellcheck= / -pyflakes= disable actionlint's external-linter
        # integrations. shellcheck is PREINSTALLED on the ubuntu-latest runner,
        # so without this actionlint auto-enables it and re-lints every run:
        # block here -- duplicating the dedicated Shellcheck step below AND
        # failing the gate on warning-severity findings (SC2046/SC2044 in
        # lint.yml's own `$(find ...)` calls). actionlint is scoped to workflow
        # syntax only; shellcheck owns the script bodies.
        run: actionlint -color -shellcheck= -pyflakes=

      # Pin a shellcheck version so the calibrated .shellcheckrc stays reproducible.
      - name: Install shellcheck 0.10.0
        run: |
          set -euo pipefail
          VER=0.10.0
          curl -sSL -o sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${VER}/shellcheck-v${VER}.linux.x86_64.tar.xz"
          tar xJf sc.tar.xz
          sudo install -m 0755 "shellcheck-v${VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # 1. Every shell script must parse
      - name: Bash syntax check
        run: |
          rc=0
          for f in $(find . -name '*.sh' -not -path './src/*'); do
            bash -n "$f" || { echo "syntax error: $f"; rc=1; }
          done
          exit $rc

      # 2. shellcheck at WARNING severity (calibrated exclusions in .shellcheckrc).
      #    No -S/-s: the scripts are #!/bin/bash, so shellcheck auto-detects bash.
      #
      #    This used to be an advisory `continue-on-error` step reporting at
      #    -S warning while the gate below ran at -S error. The advisory sat
      #    at 28 findings indefinitely, which is what advisory steps do. All
      #    28 were real (SC2064 traps that expanded at registration time,
      #    `rm -rf boost_$(...)` that degraded to `rm -rf boost_` on an empty
      #    var, `kill -9 $(ps | grep ...)` with no match handing `kill` an
      #    empty argument list) and were fixed instead of being silenced, so
      #    the ratchet the comment below called for has been tightened:
      #    warnings now fail the gate.
      #
      #    -S info stays out on purpose: it flags style opinions (quoted
      #    redirections, `local x=$(...)`) across 86 files with no signal-to-
      #    noise payoff. Revisit if the warning gate has been clean for a
      #    release cycle.
      - name: Shellcheck
        run: shellcheck -S warning $(find . -name '*.sh' -not -path './src/*')

      # Advisory-only remainder: style-level findings that are reported but do
      # not gate. When this has been clean for a while, move -S info into the
      # gate above and delete this step.
      - name: Shellcheck (info severity, advisory)
        continue-on-error: true
        run: shellcheck -S info $(find . -name '*.sh' -not -path './src/*') || true

      # 3. Anti-regression static checks (swallowed exits, unguarded extractions, CWD balance)
      - name: Static checks
        run: bash tools/lint/static_checks.sh

      # 4. Offline logic tests (stubbed, no network / no build)
      - name: Offline logic tests
        run: bash tools/test_offline.sh

      # 5. Supported-release gate: accept Debian 12/13 + Ubuntu 24.04/26.04 and
      #    the derivatives built on them, refuse everything older. The same set
      #    container.yml exercises, so widening one without the other goes red.
      - name: OS gate checks
        run: bash tools/lint/os_gate_checks.sh
