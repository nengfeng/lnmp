name: Container preflight

# Layer 1 of the container test net: prove that the installer's dependency
# stage actually resolves on each supported distro (catches package renames
# and removals that static analysis cannot see). Fast: no download, no compile.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    name: preflight (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
          - image: ubuntu:22.04
          # Newer/re-rolled distros ship the t64-renamed runtime libraries
          # (libaio1 -> libaio1t64, libglib2.0-0 -> libglib2.0-0t64), which
          # resolve_pkg_name() now maps at runtime. Both were green on the run
          # after that fix, so they block like the others. An apt-cache miss is
          # advisory only -- apt gets the final say -- so a heuristic hiccup
          # cannot fail a distro whose dependencies apt can install.
          - image: debian:13
          - image: ubuntu:24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            bash tools/container/preflight.sh

      # The job log already prints the tail of install.log on failure; the
      # artifact preserves the full transcript for follow-up analysis.
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-logs-${{ strategy.job-index }}
          path: |
            install.log
            preflight-install.log
          if-no-files-found: ignore
