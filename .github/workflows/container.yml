name: Container preflight

# Layer 1 of the container test net: prove that the installer's dependency
# stage actually resolves on each supported distro (catches package renames
# and removals that static analysis cannot see). Fast: no download, no compile.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  preflight:
    name: preflight (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
          - image: ubuntu:24.04
          # Current support window: Debian 12/13, Ubuntu 24.04/26.04. Older
          # releases are deliberately not covered -- the installer may still
          # work on them, but nothing here claims it.
          #
          # These four all ship the t64-renamed runtime libraries
          # (libaio1 -> libaio1t64, libglib2.0-0 -> libglib2.0-0t64), which
          # resolve_pkg_name() maps at runtime. An apt-cache miss is advisory
          # only -- apt gets the final say -- so a heuristic hiccup cannot fail
          # a distro whose dependencies apt can install.
          #
          # ubuntu:26.04 (Resolute Raccoon, released 2026-04-23) is the one to
          # watch: it replaces most GNU coreutils with Rust equivalents
          # (cp/mv/rm excepted), so any script that leans on an exact GNU
          # edge-case behaviour shows up here first.
          - image: debian:13
          - image: ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.image }}" \
            bash tools/container/preflight.sh

      # The job log already prints the tail of install.log on failure; the
      # artifact preserves the full transcript for follow-up analysis.
      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-logs-${{ strategy.job-index }}
          path: |
            install.log
            preflight-install.log
          if-no-files-found: ignore
