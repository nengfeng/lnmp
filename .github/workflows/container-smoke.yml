name: Container smoke

# Layer 2 of the container test net: a real install inside a systemd container
# (Nginx + PHP + MariaDB), then the same command again to prove idempotency,
# then a full uninstall to prove nothing is left behind.
#
# L1 (container.yml) is the fast dependency check that runs on every push.
# This one compiles for 20-40 minutes, so it runs weekly and on demand instead
# of on every push -- it is the last line of defence, not the first.
#
# systemd is required and no official image ships it, so the job builds one
# from tools/container/systemd.Dockerfile first. That has to happen at build
# time: PID 1 cannot be replaced in a container that is already running, and
# the earlier attempt to apt-get systemd from inside `docker run` both raced
# the readiness probe and never produced a usable init. See the Dockerfile for
# why systemd is needed at all.
#
# The base distro rotates weekly over the supported set (the same four
# container.yml preflights): debian:12, debian:13, ubuntu:24.04, ubuntu:26.04.
# One combination per run keeps this layer about depth, not breadth, while the
# rotation still exercises every supported distro with a real install about
# once a month. ubuntu:26.04 is deliberately included and deliberately NOT
# marked continue-on-error: its Rust coreutils (uutils) are exactly the kind
# of change only a real install can shake out -- if it goes red, fix the
# incompatibility or, as a stopgap, drop it from the rotation here with a
# comment saying why.
on:
  schedule:
    # Every Sunday at 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      image:
        description: 'Base image (defaults to the weekly rotation)'
        required: false
        type: string

jobs:
  pick:
    name: pick this week's distro
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.rot.outputs.image }}
    steps:
      - name: Rotate through the supported distros
        id: rot
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          if [ -n "$INPUT_IMAGE" ]; then
            image="$INPUT_IMAGE"
          else
            # Deterministic epoch-week rotation over the supported set.
            case $(( $(date +%s) / 604800 % 4 )) in
              0) image=debian:12 ;;
              1) image=debian:13 ;;
              2) image=ubuntu:24.04 ;;
              3) image=ubuntu:26.04 ;;
            esac
          fi
          echo "This week's smoke target: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  smoke:
    needs: pick
    name: smoke (${{ needs.pick.outputs.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONTAINER: lnmp-smoke
      IMAGE: lnmp-smoke-systemd
      BASE_IMAGE: ${{ needs.pick.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build a systemd-enabled base image
        run: docker build --build-arg BASE_IMAGE="$BASE_IMAGE" -t "$IMAGE" -f tools/container/systemd.Dockerfile tools/container

      - name: Boot it with systemd as PID 1
        run: |
          docker run -d --name "$CONTAINER" \
            --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v "$PWD:/work" -w /work \
            "$IMAGE"
          for _ in $(seq 1 30); do
            # Fail fast with the container log rather than probing a corpse for
            # a minute: an init that exits immediately is a build problem, not
            # a slow start.
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null || echo false)" != "true" ]; then
              echo "container exited before systemd came up; its log follows:" >&2
              docker logs "$CONTAINER" >&2 || true
              exit 1
            fi
            state=$(docker exec "$CONTAINER" systemctl is-system-running 2>/dev/null || true)
            case "$state" in
              running | degraded)
                echo "systemd is up (state: $state)"
                exit 0
                ;;
            esac
            echo "systemd state: ${state:-<not up yet>}"
            sleep 2
          done
          echo "systemd never reached a usable state; container log follows:" >&2
          docker logs "$CONTAINER" >&2 || true
          exit 1

      - name: Smoke (install -> idempotent re-run -> uninstall)
        # tee the run's own stdout (stage verdicts, PASS/FAIL lines) into the
        # workspace so the artifact carries them - the per-stage logs only
        # cover what the stages themselves print, and a failing assertion was
        # invisible in the artifact, diagnosable only from the job log.
        run: |
          set -o pipefail
          docker exec -w /work "$CONTAINER" bash tools/container/smoke.sh 2>&1 | tee smoke-stdout.log

      # Reproduce the failing tail in the job log: going through the artifact
      # download to find out why a 30-minute run went red is a bad trade.
      - name: Show logs on failure
        if: failure()
        run: |
          for f in smoke-stdout.log smoke-install.log install.log smoke-vhost-add.log smoke-vhost-del.log smoke-backup.log smoke-composer.log smoke-rerun.log smoke-uninstall.log; do
            if [ -f "$f" ]; then
              echo "===== ${f} (tail) ====="
              tail -n 60 "$f"
            fi
          done
          echo "===== failed units ====="
          docker exec "$CONTAINER" systemctl --failed --no-pager || true
          for unit in nginx php-fpm mysqld mariadb; do
            echo "===== journal: ${unit} (tail) ====="
            docker exec "$CONTAINER" journalctl -u "${unit}" -n 25 --no-pager || true
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            smoke-*.log
            install.log
          if-no-files-found: ignore

      - name: Remove the container
        if: always()
        run: docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
